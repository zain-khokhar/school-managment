services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    ports:
      - "5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./school:/mnt/extra-addons/school
      - ./assignment:/mnt/extra-addons/assignment
      - ./exam:/mnt/extra-addons/exam
      - ./timetable:/mnt/extra-addons/timetable
      - ./library:/mnt/extra-addons/library
      - ./school_attendance:/mnt/extra-addons/school_attendance
      - ./school_event:/mnt/extra-addons/school_event
      - ./school_fees:/mnt/extra-addons/school_fees
      - ./school_hostel:/mnt/extra-addons/school_hostel
      - ./school_transport:/mnt/extra-addons/school_transport

volumes:
  odoo-db-data:
  odoo-web-data:

