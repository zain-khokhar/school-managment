<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>School Management ERP</title>

  <!-- Design system — load order matters -->
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/feedback-and-screens.css" />
  <link rel="stylesheet" href="/static/css/phase2.css" />
  <link rel="stylesheet" href="/static/css/fees-and-print.css" />
</head>

<body>

  <div class="app-shell">

    <!-- ── Left Sidebar ──────────────────────────────────────── -->
    <aside class="sidebar" role="navigation" aria-label="Main navigation">

      <!-- Brand Header -->
      <div class="sidebar-brand">
        <div class="sidebar-brand-logo" aria-hidden="true">S</div>
        <div>
          <div class="sidebar-brand-name" id="brand-school-name">School ERP</div>
          <div class="sidebar-brand-sub">Offline Desktop Edition</div>
        </div>
      </div>

      <!-- Nav Items (built by router.js) -->
      <nav class="sidebar-nav" aria-label="Modules">
        <ul id="nav-list" role="list"></ul>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div>Local SQLite WAL Storage</div>
        <div class="sidebar-footer-status">
          <div class="status-dot" id="db-status-dot"></div>
          <span id="db-status-label">Connected</span>
        </div>
      </div>

    </aside>

    <!-- ── Main Workspace ─────────────────────────────────────── -->
    <main class="workspace" role="main">

      <!-- Topbar -->
      <header class="topbar" role="banner" style="position:relative;">
        <div class="topbar-left">
          <h1 class="page-title" id="page-title">Overview</h1>
          <span class="page-breadcrumb" id="page-breadcrumb" aria-hidden="true"></span>
        </div>

        <div class="topbar-right">
          <!-- Global Search -->
          <div class="topbar-search" role="search">
            <span class="topbar-search-icon" aria-hidden="true">
              <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.35" y2="16.35"/></svg>
            </span>
            <input type="search" id="topbar-search-input" class="topbar-search-input"
              placeholder="Search student, GR, voucher..." autocomplete="off" aria-label="Global search" />
            <kbd class="topbar-search-kbd" title="Ctrl+K to focus">Ctrl K</kbd>
          </div>

          <!-- Backup Health Indicator (Phase 2 — Section 9.5) -->
          <button type="button" class="backup-pill" id="topbar-backup-pill" title="Backup status">
            <svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
            <span id="topbar-backup-label">Backup</span>
          </button>

          <!-- User & Role Indicator + Sign Out -->
          <div id="topbar-user-area" style="display:flex; align-items:center; gap:6px;"></div>

          <!-- Refresh button -->
          <button type="button" class="topbar-btn" id="btn-refresh" title="Refresh workspace" aria-label="Refresh workspace">
            <svg class="ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          </button>
        </div>
      </header>

      <!-- Content Area -->
      <div class="content-area" id="content-area">
        <div class="content-inner">
          <section id="main-view" aria-live="polite" aria-label="Main content">
            <div class="panel">
              <div class="panel-body">
                <div class="skeleton skeleton-title" style="width:200px"></div>
                <div class="skeleton skeleton-row" style="margin-top:16px"></div>
                <div class="skeleton skeleton-row"></div>
                <div class="skeleton skeleton-row"></div>
              </div>
            </div>
          </section>
        </div>
      </div>

    </main>
  </div>

  <!-- ── Modal (shared, single instance) ─────────────────────── -->
  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Record</div>
        <button type="button" class="btn btn-icon btn-ghost btn-sm" id="modal-close" aria-label="Close modal">
          <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="modal-form" novalidate>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer">
          <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Toast Container ──────────────────────────────────────── -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- ── Isolated Print Mount (Bank Vouchers, A4 & 80mm Receipts) ── -->
  <div id="print-mount" class="print-mount" aria-hidden="true"></div>

  <!-- ── Scripts (Strangler-Fig Order: Legacy Bridge first, then ES Module Shell) ── -->
  <script src="/static/app.js"></script>
  <script type="module" src="/static/js/main.js"></script>

</body>

</html>
